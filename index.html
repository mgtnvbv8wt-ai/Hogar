<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro Hogar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e05d3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hogar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#fbf6f0; --card:#ffffff; --ink:#2a211c; --muted:#8a7d74; --line:#eadfd3;
  --accent:#e05d3f; --accent-ink:#fff; --accent-soft:#fde7df; --mine:#e05d3f; --theirs:#efe6db;
  --ok:#3c8d5a; --danger:#c0392b;
  --radius:16px; --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){ --bg:#17120f; --card:#241d19; --ink:#f4ece4; --muted:#a39385; --line:#3a2f28;
    --accent:#ee7355; --accent-soft:#3b2219; --mine:#c9502f; --theirs:#352b25; --ok:#5fb07d; --danger:#e8695a; }
}
:root[data-theme=dark]{ --bg:#17120f; --card:#241d19; --ink:#f4ece4; --muted:#a39385; --line:#3a2f28;
  --accent:#ee7355; --accent-soft:#3b2219; --mine:#c9502f; --theirs:#352b25; --ok:#5fb07d; --danger:#e8695a; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:calc(16px * var(--fs))/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--accent);padding:8px 10px}
button.soft{background:var(--accent-soft);color:var(--accent)}
button.danger{background:transparent;color:var(--danger)}
button:disabled{opacity:.5}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
header h1{font-size:calc(22px * var(--fs));margin:0;letter-spacing:-.3px}
main{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav button{background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0;padding:6px 0;font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:calc(13px * var(--fs))}
.row{display:flex;gap:8px;align-items:center}
.stack>*+*{margin-top:10px}

/* auth */
.auth{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 20px 20px}
.auth h1{font-size:calc(30px * var(--fs));letter-spacing:-.5px;margin:0 0 4px}
.auth .logo{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
.err{color:var(--danger);font-size:calc(14px * var(--fs));min-height:20px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;font-size:calc(18px * var(--fs))}.cal-head h2::first-letter{text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:calc(12px * var(--fs));color:var(--muted);padding:4px 0;font-weight:600}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:transparent;color:var(--ink);padding:0;font-weight:500;position:relative}
.day.out{color:var(--muted);opacity:.45}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px;visibility:hidden}
.day.has .dot{visibility:visible}
.day.sel .dot{background:var(--accent-ink)}

.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .time{min-width:54px;font-weight:700;color:var(--accent);font-size:calc(14px * var(--fs));padding-top:1px}
.ev .body{flex:1;min-width:0}
.ev .t{font-weight:600;word-break:break-word}
.ev .del{padding:4px 8px;font-size:calc(20px * var(--fs));line-height:1}
.group-title{font-size:calc(13px * var(--fs));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 6px}

/* chat */
#view-chat{display:flex;flex-direction:column;height:100%}
#chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0 10px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--theirs);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.msg.mine{background:var(--mine);color:#fff;align-self:flex-end}
.msg .who{display:block;font-size:calc(11px * var(--fs));font-weight:700;opacity:.7;margin-bottom:1px}
.msg .at{display:block;font-size:calc(10px * var(--fs));opacity:.6;margin-top:2px;text-align:right}
.composer{display:flex;gap:8px;padding-top:8px}
.composer input{flex:1}

/* shopping */
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;flex:none;display:grid;place-items:center;color:#fff}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .nm{flex:1;word-break:break-word}
.item .cn{flex:1;min-width:0;word-break:break-word}
.item.done .cn .ct{text-decoration:line-through;color:var(--muted)}
.meal{padding:7px 0}
.meal+.meal{border-top:1px solid var(--line)}
.meal .ml{font-size:calc(12px * var(--fs));font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.meal .mt{white-space:pre-wrap;word-break:break-word}
.menu-day{display:flex;gap:8px;align-items:flex-start}
.menu-day>div:first-child{flex:1;min-width:0}
.menu-day h4{margin:0 0 2px;font-size:calc(15px * var(--fs))}.menu-day h4::first-letter{text-transform:uppercase}
details.past{margin:14px 2px}
details.past summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.mrow textarea{grid-column:1 / -1}

/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90dvh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:calc(20px * var(--fs))}
label.f{display:block;font-size:calc(13px * var(--fs));font-weight:600;color:var(--muted);margin:10px 0 4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:calc(14px * var(--fs));z-index:20}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.code{font:700 26px/1 ui-monospace,Menlo,monospace;letter-spacing:3px;background:var(--accent-soft);color:var(--accent);padding:12px 14px;border-radius:12px;text-align:center}

/* nuevas piezas */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--accent-soft);border-radius:12px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{background:transparent;color:var(--accent);padding:8px 4px;border-radius:10px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:500;font-size:14px}
.chip.on{background:var(--accent-soft);color:var(--muted);border-color:var(--line)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;color:var(--ink);font-weight:500}
.tile .n{display:block;font-size:calc(28px * var(--fs));font-weight:700;color:var(--accent);line-height:1.1}
.dotm{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.late{background:var(--danger);color:#fff}
.title-row{display:flex;align-items:center;justify-content:space-between}
.title-row .group-title{margin-right:8px}
.preview{max-height:36dvh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);margin-top:10px}
.preview .pd{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.preview .pd:first-child{border-top:0}
.sel-row{display:flex;gap:6px;flex-wrap:wrap}
.wx{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;color:var(--ink);font-weight:500}
.wx .where{font-size:calc(12px * var(--fs));font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.wx .big{font-size:calc(38px * var(--fs));font-weight:700;line-height:1}
.wx .stats{display:grid;gap:3px;text-align:right;font-size:calc(14px * var(--fs));color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-weight:600}
.spark{width:100%;height:90px;display:block;margin:6px 0 2px}
</style>
</head>
<body>

<!-- Pantalla de acceso -->
<div id="auth" class="auth" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Nuestro Hogar</h1>
  <p class="muted" style="margin:0 0 20px">Calendario, chat, compra, tareas y menú, solo para vosotros.</p>
  <form id="authForm" class="stack">
    <input id="aEmail" type="email" placeholder="Email" autocomplete="email" required>
    <input id="aPass" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password" minlength="6" required>
    <div class="err" id="aErr"></div>
    <button id="aGo" type="submit" style="width:100%">Entrar</button>
    <button id="aSwitch" type="button" class="ghost" style="width:100%">Crear cuenta nueva</button>
  </form>
</div>

<!-- Elegir hogar -->
<div id="onboard" class="auth" hidden>
  <h1>Vuestro hogar</h1>
  <p class="muted" style="margin:0 0 18px">Uno de los dos crea el hogar y el otro se une con el código.</p>
  <div class="card stack">
    <strong>Tu nombre</strong>
    <input id="oName" placeholder="Cómo te llamas" maxlength="30">
  </div>
  <div class="card stack">
    <strong>Crear un hogar</strong>
    <input id="oHome" placeholder="Nombre (p. ej. Casa)" maxlength="40">
    <button id="oCreate" style="width:100%">Crear hogar</button>
  </div>
  <div class="card stack">
    <strong>Unirme con código</strong>
    <input id="oCode" placeholder="Código de invitación" autocapitalize="none" autocorrect="off" maxlength="20">
    <button id="oJoin" class="soft" style="width:100%">Unirme</button>
  </div>
  <div class="err" id="oErr"></div>
  <button id="oOut" class="ghost" style="width:100%">Cerrar sesión</button>
</div>

<!-- App -->
<div id="app" hidden>
  <header>
    <h1 id="title">Calendario</h1>
    <button class="ghost" id="btnSettings" aria-label="Ajustes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main>
    <section id="view-home" hidden>
      <div id="homeBox"></div>
    </section>

    <section id="view-cal" hidden>
      <div class="seg" id="calSeg">
        <button data-m="month" class="on">Mes</button>
        <button data-m="list">Próximos eventos</button>
      </div>
      <div id="calMonth">
      <div class="card">
        <div class="cal-head">
          <button class="ghost" id="prevM" aria-label="Mes anterior">‹</button>
          <h2 id="monthTitle"></h2>
          <button class="ghost" id="nextM" aria-label="Mes siguiente">›</button>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="days"></div>
      </div>
      <div class="row" style="justify-content:space-between;margin:6px 2px">
        <strong id="dayTitle"></strong>
        <button class="soft" id="addEvDay">+ Evento</button>
      </div>
      <div class="card" id="dayList"></div>
      </div>
      <div id="calList" hidden>
        <div class="row" style="justify-content:flex-end;margin-bottom:6px"><button id="addEv">+ Nuevo evento</button></div>
        <div id="evList"></div>
      </div>
    </section>

    <section id="view-chat" hidden>
      <div id="chatlog"></div>
      <form class="composer" id="chatForm">
        <input id="chatIn" placeholder="Escribe un mensaje…" autocomplete="off" maxlength="2000">
        <button type="submit" aria-label="Enviar">Enviar</button>
      </form>
    </section>

    <section id="view-shop" hidden>
      <div class="seg" id="shopSeg"></div>
      <form class="row" id="shopForm" style="margin-bottom:8px">
        <input id="shopIn" placeholder="Añadir a la compra…" autocomplete="off" maxlength="100">
        <button type="submit">Añadir</button>
      </form>
      <select id="shopCat" aria-label="Categoría" style="margin-bottom:12px"></select>
      <div id="staples"></div>
      <div id="shopList"></div>
      <button class="danger" id="clearDone" style="width:100%">Borrar los comprados</button>
    </section>

    <section id="view-chores" hidden>
      <div class="seg" id="choreSeg"></div>
      <form class="row" id="choreForm" style="margin-bottom:12px">
        <input id="choreIn" placeholder="Nueva tarea…" autocomplete="off" maxlength="200">
        <button type="submit">Añadir</button>
        <button type="button" class="soft" id="choreMore" aria-label="Más opciones">Más</button>
      </form>
      <div class="card" id="choreList"></div>
      <button class="danger" id="clearChores" style="width:100%">Borrar las hechas</button>
    </section>

    <section id="view-menu" hidden>
      <div id="menuBox"></div>
    </section>
  </main>
  <nav id="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendario</button>
    <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Chat</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Compra</button>
    <button data-tab="chores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Coses</button>
    <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg>Menú</button>
  </nav>
</div>

<div id="modal" class="sheet-bg" hidden><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://rlsxtsmaxhirdiljzsck.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7JI6ZuxHzsHYc1VcrGK5fg_xtT6nQfx';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const state = { user:null, member:null, household:null, members:{}, events:[], messages:[], items:[], chores:[], menu:[], staples:[],
  tab:'home', place:loadPlace(), stations:[], weather:null, weatherAt:0, weatherBusy:false, calMode:'month', stapleEdit:false, month:new Date(), sel:new Date(), channel:null, signup:false };

/* ---------- preferencias (tema y tamaño de letra) ---------- */
const PLACES = [['estartit', "L'Estartit"], ['torello', 'Torelló']];
const PLACE_NAME = Object.fromEntries(PLACES);
function loadPlace() { try { const v = localStorage.getItem('hogar-place'); return PLACE_NAME[v] ? v : 'estartit'; } catch (_) { return 'estartit'; } }
function savePlace(v) { try { localStorage.setItem('hogar-place', v); } catch (_) {} }
const PREFS_KEY = 'hogar-prefs';
function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (_) { return {}; } }
function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (_) {} }
function applyPrefs() {
  const p = loadPrefs(), r = document.documentElement;
  if (p.theme === 'light' || p.theme === 'dark') r.dataset.theme = p.theme; else delete r.dataset.theme;
  r.style.setProperty('--fs', { normal:1, large:1.15, xl:1.3 }[p.size] || 1);
  const dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#17120f' : '#e05d3f';
}
applyPrefs();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPrefs);

/* ---------- utilidades ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sameDay = (a,b) => ymd(a)===ymd(b);
const fmtTime = d => d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const fmtDay = d => d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const el = (tag, props={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k==='class') e.className=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if (k==='text') e.textContent=v; else e.setAttribute(k,v);
  }
  kids.flat().forEach(c => c!=null && e.append(c.nodeType?c:document.createTextNode(c)));
  return e;

const keyDate = k => new Date(k + 'T00:00:00');

async function loadAll() {
  const since = new Date(Date.now() - 60*86400e3).toISOString();
  const [ev, ms, it, ch, mn, st, wst] = await Promise.all([
    sb.from('events').select('*').or('starts_at.gte.' + since + ',recur.not.is.null').order('starts_at'),
    sb.from('messages').select('*').order('created_at', { ascending:false }).limit(200),
    sb.from('shopping_items').select('*').order('created_at'),
    sb.from('chores').select('*').order('created_at'),
    sb.from('menu_days').select('*').gte('day', ymd(new Date(Date.now() - 45*86400e3))).order('day'),
    sb.from('shopping_staples').select('*').order('name'),
    sb.from('weather_stations').select('*'),
  ]);
  state.events = ev.data || [];
  state.messages = (ms.data || []).reverse();
  state.items = it.data || [];
  state.chores = ch.data || [];
  state.menu = mn.data || [];
  state.staples = st.data || [];
  state.stations = wst.data || [];
}
function teardown() {
  if (state.channel) { sb.removeChannel(state.channel); state.channel = null; }

/* ---------- tiempo real ---------- */
function upsert(list, row) { const i = list.findIndex(x => x.id===row.id); if (i>=0) list[i]=row; else list.push(row); }
function subscribe() {
  if (state.channel) sb.removeChannel(state.channel);
  const hid = state.household.id;
  const f = `household_id=eq.${hid}`;
  const ch = sb.channel('hogar-'+hid);
  for (const [table, key, sort] of [['events','events',(a,b)=>a.starts_at.localeCompare(b.starts_at)],
                                    ['messages','messages',(a,b)=>a.created_at.localeCompare(b.created_at)],
                                    ['shopping_items','items',(a,b)=>a.created_at.localeCompare(b.created_at)],
                                    ['chores','chores',(a,b)=>a.created_at.localeCompare(b.created_at)],
                                    ['menu_days','menu',(a,b)=>a.day.localeCompare(b.day)],
                                    ['shopping_staples','staples',(a,b)=>a.name.localeCompare(b.name)]]) {
    ch.on('postgres_changes', { event:'*', schema:'public', table, filter:f }, p => {
      if (p.eventType==='DELETE') state[key] = state[key].filter(x => x.id !== p.old.id);
      else { upsert(state[key], p.new); state[key].sort(sort); }
      render();
    });
  }
  ch.subscribe();
  state.channel = ch;
  // al volver a la app, refrescar por si el socket se durmió
  if (!state.visHooked) {
    state.visHooked = true;
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState==='visible' && state.household) { await loadAll(); render(); loadWeather(); }
    });
    setInterval(() => { if (state.tab === 'home' && document.visibilityState === 'visible') loadWeather(); }, 5 * 60 * 1000);
  }
}

/* repeticiones: se calculan al vuelo a partir del evento «serie» */
const REC_LABEL = { daily:'Cada día', weekly:'Cada semana', monthly:'Cada mes', yearly:'Cada año' };
function nthStart(e, n) {
  const s = new Date(e.starts_at), H = s.getHours(), M = s.getMinutes();
  if (e.recur === 'daily')  return new Date(s.getFullYear(), s.getMonth(), s.getDate() + n, H, M);
  if (e.recur === 'weekly') return new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7*n, H, M);
  if (e.recur === 'monthly' || e.recur === 'yearly') {
    const first = new Date(s.getFullYear(), s.getMonth() + (e.recur === 'yearly' ? 12*n : n), 1, H, M);
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    first.setDate(Math.min(s.getDate(), last)); return first;
  }
  return s;
}
function occurrences(e, from, to) {          // apariciones con inicio en [from, to)
  const s = new Date(e.starts_at);
  if (!e.recur) return (s >= from && s < to) ? [e] : [];
  const dur = e.ends_at ? new Date(e.ends_at) - s : 0;
  const until = e.recur_until ? new Date(e.recur_until + 'T23:59:59') : null;
  const per = { daily:864e5, weekly:6048e5 }[e.recur];
  let n = per ? Math.floor((from - s) / per) - 1
              : Math.floor(((from.getFullYear()-s.getFullYear())*12 + from.getMonth()-s.getMonth()) / (e.recur === 'yearly' ? 12 : 1)) - 1;
  n = Math.max(0, n);
  const out = [];
  for (let i = 0; i < 800; i++, n++) {
    const st = nthStart(e, n);
    if (st >= to || (until && st > until)) break;
    if (st >= from) out.push({ ...e, starts_at: st.toISOString(), ends_at: e.ends_at ? new Date(st.getTime() + dur).toISOString() : null, _series: e });
  }
  return out;
}
function eventsOn(d) {
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  return state.events.flatMap(e => occurrences(e, a, b)).sort((x, y) => x.starts_at.localeCompare(y.starts_at));
}
function upcomingEvents(days) {              // desde hoy; los que no se repiten, todos los futuros
  const a = new Date(); a.setHours(0,0,0,0);
  const horizon = new Date(a.getFullYear(), a.getMonth(), a.getDate() + days);
  return state.events.flatMap(e => e.recur ? occurrences(e, a, horizon) : (new Date(e.starts_at) >= a ? [e] : []))
    .sort((x, y) => x.starts_at.localeCompare(y.starts_at));
}

function eventForm(day, ev=null) {
  const base = ev ? new Date(ev.starts_at) : new Date(day.getFullYear(), day.getMonth(), day.getDate(), 20, 0);
  const end = ev?.ends_at ? new Date(ev.ends_at) : null;
  const local = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const title = el('input',{placeholder:'Título (p. ej. Cena con los suegros)',maxlength:'120',value:ev?.title||''});
  const allDay = el('input',{type:'checkbox',style:'width:auto'}); allDay.checked = !!ev?.all_day;
  const start = el('input',{type:'datetime-local',value:local(base)});
  const endI = el('input',{type:'datetime-local',value:end?local(end):''});
  const place = el('input',{placeholder:'Lugar (opcional)',maxlength:'120',value:ev?.location||''});
  const notes = el('textarea',{placeholder:'Notas (opcional)',rows:'2',maxlength:'500'}); notes.value = ev?.notes||'';
  const recur = el('select',{}, el('option',{value:'',text:'No se repite'}),
    ...Object.entries(REC_LABEL).map(([k,v]) => el('option',{value:k,text:v})));
  recur.value = ev?.recur || '';
  const until = el('input',{type:'date',value:ev?.recur_until||''});
  const untilWrap = el('div',{}, el('label',{class:'f',text:'Repetir hasta (opcional)'}), until);
  const syncRecur = () => { untilWrap.hidden = !recur.value; };
  recur.onchange = syncRecur;
  const err = el('div',{class:'err'});
  const syncType = () => { const t = allDay.checked?'date':'datetime-local'; start.type=t; endI.type=t;
    start.value = allDay.checked ? ymd(base) : local(base); endI.value=''; endI.parentElement.hidden = allDay.checked; };
  const endWrap = el('div',{},el('label',{class:'f',text:'Fin (opcional)'}),endI);
  allDay.onchange = syncType;
  const save = el('button',{text:ev?'Guardar':'Crear evento',style:'flex:1'});
  save.onclick = async () => {
    if (!title.value.trim()) { err.textContent='Pon un título.'; return; }
    if (!start.value) { err.textContent='Pon la fecha.'; return; }
    const s = allDay.checked ? new Date(start.value+'T00:00:00') : new Date(start.value);
    const e2 = (!allDay.checked && endI.value) ? new Date(endI.value) : null;
    if (e2 && e2 < s) { err.textContent='El fin es anterior al inicio.'; return; }
    if (recur.value && until.value && until.value < ymd(s)) { err.textContent='«Repetir hasta» es anterior al inicio.'; return; }
    const row = { title:title.value.trim(), location:place.value.trim()||null, notes:notes.value.trim()||null,
      starts_at:s.toISOString(), ends_at:e2?e2.toISOString():null, all_day:allDay.checked,
      recur: recur.value || null, recur_until: recur.value && until.value ? until.value : null };
    save.disabled = true;
    const q = ev ? sb.from('events').update(row).eq('id',ev.id).select().single()
                 : sb.from('events').insert({ ...row, household_id: state.household.id }).select().single();
    const { data, error } = await q;
    if (error) { err.textContent = errMsg(error); save.disabled=false; return; }
    upsert(state.events, data); state.events.sort((a,b)=>a.starts_at.localeCompare(b.starts_at));
    state.sel = s; state.month = new Date(s.getFullYear(), s.getMonth(), 1);
    closeSheet(); render();
  };
  const kids = [el('h3',{text:ev?'Editar evento':'Nuevo evento'}), title,
    el('label',{class:'f row'},allDay,' Todo el día'),
    el('label',{class:'f',text:'Inicio'}), start, endWrap,
    el('label',{class:'f',text:'Repetición'}), recur, untilWrap,
    el('label',{class:'f',text:'Lugar'}), place, el('label',{class:'f',text:'Notas'}), notes, err,
    el('div',{class:'row',style:'margin-top:12px'},
      el('button',{class:'ghost',text:'Cancelar',onclick:closeSheet}), save)];
  if (ev) kids.push(el('button',{class:'danger',style:'width:100%;margin-top:6px',text:ev.recur?'Eliminar toda la serie':'Eliminar evento',onclick:async()=>{
    if (!confirm(ev.recur ? '¿Eliminar este evento y todas sus repeticiones?' : '¿Eliminar este evento?')) return;
    const { error } = await sb.from('events').delete().eq('id',ev.id);
    if (error) { err.textContent=errMsg(error); return; }
    state.events = state.events.filter(x=>x.id!==ev.id); closeSheet(); render();
  }}));
  openSheet(...kids);
  syncType(); if (!allDay.checked) { start.value = local(base); }
  syncRecur();
}

const CHORE_REC = { daily:'Cada día', weekly:'Cada semana', monthly:'Cada mes' };
const DOW_ORDER = [[1,'L'],[2,'M'],[3,'X'],[4,'J'],[5,'V'],[6,'S'],[0,'D']];   // getDay(): 0 = domingo
function nextDue(c) {
  const today = ymd(new Date());
  const base = (c.due && c.due > today) ? c.due : today;
  if (c.recur === 'daily') return addDaysYmd(base, 1);
  if (c.recur === 'weekly') {
    const days = (c.recur_days && c.recur_days.length) ? c.recur_days : [keyDate(c.due || today).getDay()];
    for (let n = 1; n <= 7; n++) { const k = addDaysYmd(base, n); if (days.includes(keyDate(k).getDay())) return k; }
  }
  if (c.recur === 'monthly') {
    const d = keyDate(base), t = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(keyDate(c.due || base).getDate(), last)); return ymd(t);
  }
  return null;
}
function dueLabel(k) {
  const today = ymd(new Date());
  if (k < today) return 'Atrasada · ' + fmtShort(keyDate(k));
  if (k === today) return 'Hoy';
  if (k === addDaysYmd(today, 1)) return 'Mañana';
  return fmtShort(keyDate(k));
}
function recurLabel(c) {
  if (!c.recur) return null;
  if (c.recur === 'weekly' && c.recur_days && c.recur_days.length) {
    return 'Cada ' + DOW_ORDER.filter(([n]) => c.recur_days.includes(n)).map(([,l]) => l).join(' ');
  }
  return CHORE_REC[c.recur];
}

  else if (c.last_done_at) meta.push('Última vez: ' + who(c.last_done_by) + ' · ' + fmtShort(new Date(c.last_done_at)));
  return el('div',{class:'item'+(c.done?' done':'')},

/* --- carga del menú en bloque: se pega el texto y se ve una vista previa antes de guardar --- */
const MONTHS = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12 };
const WEEKDAY = '(?:lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo)';
function parseMenuText(text, ym) {                       // ym = 'YYYY-MM' por defecto
  const [dy, dm] = ym.split('-').map(Number);
  const days = [], warnings = [];
  let cur = null;
  const mkKey = (y, m, d) => {
    const dt = new Date(y, m - 1, d);
    if (m < 1 || m > 12 || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return ymd(dt);
  };
  const monthNum = n => MONTHS[n.toLowerCase().normalize('NFC')] || null;
  const dayHeader = line => {
    let m;
    if ((m = line.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\b[:.\-–]?\s*(.*)$/))) return [mkKey(+m[1], +m[2], +m[3]), m[4]];
    if ((m = line.match(new RegExp('^(?:' + WEEKDAY + ')?[\\s,.]*(\\d{1,2})[\\/.\\-](\\d{1,2})(?:[\\/.\\-](\\d{2,4}))?\\b[:.\\-–]?\\s*(.*)$', 'i')))) {
      const y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : dy; return [mkKey(y, +m[2], +m[1]), m[4]];
    }
    if ((m = line.match(new RegExp('^' + WEEKDAY + '\\.?,?\\s+(?:d[ií]a\\s+)?(\\d{1,2})(?:\\s+de\\s+([a-zá-ú]+))?\\b[:.\\-–]?\\s*(.*)$', 'i')))) {
      const mo = m[2] ? monthNum(m[2]) : dm; return [mo ? mkKey(dy, mo, +m[1]) : null, m[3]];
    }

async function loadWeather(force) {
  if (!state.household || !state.stations.length || state.weatherBusy) return;
  if (!force && Date.now() - state.weatherAt < 2 * 60 * 1000) return;
  state.weatherBusy = true;
  try {
    const { data, error } = await sb.functions.invoke('weather', { body: {} });
    if (error) throw error;
    state.weather = data; state.weatherAt = Date.now();
  } catch (_) {
    state.weather = { configured: true, stations: [], failed: true }; state.weatherAt = Date.now() - 90 * 1000;   // reintenta en ~30 s
  }
  state.weatherBusy = false;
  if (state.tab === 'home') renderHome();
}

function sparkline(points) {                     // [{t: ms, v: número}] → SVG

  const d = points.map((p, i) => { const [x, y] = xy(p); return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }).join(' ');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'spark'); svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  return svg;
}

async function exportBackup() {
  toast('Preparando copia…');
  const get = async (t, q) => { const { data, error } = await q; if (error) throw error; return data; };
  try {
    const [eventos, mensajes, compra, habituales, tareas, menu] = await Promise.all([
      get('events', sb.from('events').select('*').order('starts_at')),
      get('messages', sb.from('messages').select('*').order('created_at')),
      get('shopping_items', sb.from('shopping_items').select('*').order('created_at')),
      get('shopping_staples', sb.from('shopping_staples').select('*').order('name')),
      get('chores', sb.from('chores').select('*').order('created_at')),
      get('menu_days', sb.from('menu_days').select('*').order('day')),
    ]);
    const data = { app:'Nuestro Hogar', exportado:new Date().toISOString(), hogar:state.household.name,
      miembros:state.members, eventos, mensajes, compra, habituales, tareas, menu };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const file = new File([blob], 'hogar-copia-' + ymd(new Date()) + '.json', { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:'Copia de seguridad de Nuestro Hogar' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = el('a',{href:URL.createObjectURL(blob), download:file.name}); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Copia descargada');
  } catch (e) { toast(errMsg(e)); }
}

      try { st==='on' ? await disablePush() : await enablePush(); }
      catch (e) { toast(errMsg(e)); }
      paint();
    };
  };
  paint();
  openSheet(
    el('h3',{text:state.household.name}),
    el('p',{class:'muted',text:'En el hogar: '+names}),
    el('label',{class:'f',text:'Código para invitar a tu pareja'}),
    el('div',{class:'code',text:state.household.invite_code}),
    el('button',{class:'soft',style:'width:100%;margin-top:10px',text:'Copiar código',onclick:async()=>{
      try { await navigator.clipboard.writeText(state.household.invite_code); toast('Código copiado'); } catch { toast('Cópialo a mano'); }}}),
    el('hr',{style:'border:0;border-top:1px solid var(--line);margin:18px 0'}),
    el('label',{class:'f',text:'Tema'}), prefSeg('theme', [['', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']]),
    el('label',{class:'f',text:'Tamaño de letra'}), prefSeg('size', [['normal', 'Normal'], ['large', 'Grande'], ['xl', 'Muy grande']]),
    el('hr',{style:'border:0;border-top:1px solid var(--line);margin:18px 0'}),
    stationFields(),
    el('hr',{style:'border:0;border-top:1px solid var(--line);margin:18px 0'}),
    el('label',{class:'f',text:'Avisos en este móvil'}),
    pushNote, pushBtn,
    el('hr',{style:'border:0;border-top:1px solid var(--line);margin:18px 0'}),
    el('label',{class:'f',text:'Copia de seguridad'}),
    el('p',{class:'small muted',style:'margin:0 0 8px',text:'Descarga todos los datos del hogar (eventos, mensajes, compra, tareas y menús) en un archivo.'}),
    el('button',{class:'soft',style:'width:100%',text:'Descargar copia de seguridad',onclick:exportBackup}),
    el('hr',{style:'border:0;border-top:1px solid var(--line);margin:18px 0'}),
    el('button',{class:'danger',style:'width:100%',text:'Cerrar sesión',onclick:()=>{closeSheet(); sb.auth.signOut();}}),
    el('button',{class:'ghost',style:'width:100%;margin-top:6px',text:'Cerrar',onclick:closeSheet}));
};

/* ---------- avisos push ---------- */
const VAPID_PUBLIC = 'BNPXq508qsSfFthyNsN8d9yyEm5sB_8NBRDzKef0Anrxf5JkaA_mFdDXOirshw-12-QAD68uKSt0X_7t_hx8b88';
const b64 = s => { const r = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function pushSub() { const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function pushState() {
  if (!pushSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  return (Notification.permission === 'granted' && await pushSub()) ? 'on' : 'off';
}
async function saveSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}
async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Permiso denegado');
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) ||
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) });
  await saveSub(sub);
}
async function disablePush() {
  const sub = await pushSub(); if (!sub) return;
  await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
  await sub.unsubscribe();
}
// mantener este dispositivo asociado al usuario actual
async function refreshPush() {
  try { if (await pushState() === 'on') await saveSub(await pushSub()); } catch (_) {}
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  const t = e.data && e.data.tab;
  if (t) openTab(t);
});

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

// estado inicial
sb.auth.getSession().then(({ data }) => { if (!data.session) showOnly('auth'); });
</script>
