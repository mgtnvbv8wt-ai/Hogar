<body>

<!-- Pantalla de acceso -->
<div id="auth" class="auth" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Nuestro Hogar</h1>
  <p class="muted" style="margin:0 0 20px">Calendario, chat, compra, tareas y menú, solo para vosotros.</p>
  <form id="authForm" class="stack">
    <input id="aEmail" type="email" placeholder="Email" autocomplete="email" required>
    <input id="aPass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <div class="err" id="aErr"></div>
    <button id="aGo" type="submit" style="width:100%">Entrar</button>
    <button id="aSwitch" type="button" class="ghost" style="width:100%">Crear cuenta nueva</button>
    <button id="aForgot" type="button" class="ghost" style="width:100%">He olvidado la contraseña</button>
  </form>
</div>

<!-- Elegir hogar -->
<div id="onboard" class="auth" hidden>
  <h1>Vuestro hogar</h1>
  <p class="muted" style="margin:0 0 18px">Uno de los dos crea el hogar y el otro se une con el código.</p>
  <div class="card stack">
    <strong>Tu nombre</strong>
    <input id="oName" placeholder="Cómo te llamas" maxlength="30">
  </div>
  <div class="card stack">
    <strong>Crear un hogar</strong>
    <input id="oHome" placeholder="Nombre (p. ej. Casa)" maxlength="40">
    <button id="oCreate" style="width:100%">Crear hogar</button>
  </div>
  <div class="card stack">
    <strong>Unirme con código</strong>
    <input id="oCode" placeholder="Código de invitación" autocapitalize="none" autocorrect="off" maxlength="20">
    <button id="oJoin" class="soft" style="width:100%">Unirme</button>
  </div>
  <div class="err" id="oErr"></div>
  <button id="oOut" class="ghost" style="width:100%">Cerrar sesión</button>
</div>

<!-- App -->
<div id="app" hidden>
  <header>
    <h1 id="title">Calendario</h1>
    <div class="hbtns"><button class="ghost" id="btnSearch" aria-label="Buscar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="ghost" id="btnSettings" aria-label="Ajustes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button></div>
  </header>
  <main>
    <section id="view-home" hidden>
      <div id="homeBox"></div>
    </section>

    <section id="view-cal" hidden>
      <div class="seg" id="calSeg">
        <button data-m="month" class="on">Mes</button>
        <button data-m="list">Próximos eventos</button>
      </div>
      <div id="calMonth">
      <div class="card">
        <div class="cal-head">
          <button class="ghost" id="prevM" aria-label="Mes anterior">‹</button>
          <h2 id="monthTitle"></h2>
          <button class="ghost" id="nextM" aria-label="Mes siguiente">›</button>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="days"></div>
      </div>
      <div class="row" style="justify-content:space-between;margin:6px 2px">
        <strong id="dayTitle"></strong>
        <button class="soft" id="addEvDay">+ Evento</button>
      </div>
      <div class="card" id="dayList"></div>
      </div>
      <div id="calList" hidden>
        <div class="row" style="justify-content:flex-end;margin-bottom:6px"><button id="addEv">+ Nuevo evento</button></div>
        <div id="evList"></div>
      </div>
    </section>

    <section id="view-chat" hidden>
      <div id="chatlog"></div>
      <div class="replybar" id="replyBar" hidden><div class="rq" id="replyQ"></div><button type="button" class="ghost" id="replyX" aria-label="Cancelar respuesta">×</button></div>
      <form class="composer" id="chatForm">
        <input id="chatIn" placeholder="Escribe un mensaje…" autocomplete="off" maxlength="2000">
        <button type="submit" aria-label="Enviar">Enviar</button>
      </form>
    </section>

    <section id="view-shop" hidden>
      <div class="seg" id="shopSeg"></div>
      <form class="row" id="shopForm" style="margin-bottom:8px">
        <input id="shopIn" placeholder="Añadir a la compra…" autocomplete="off" maxlength="100">
        <button type="submit">Añadir</button>
      </form>
      <select id="shopCat" aria-label="Categoría" style="margin-bottom:12px"></select>
      <div id="staples"></div>
      <div id="shopList"></div>
      <button class="danger" id="clearDone" style="width:100%">Borrar los comprados</button>
    </section>

    <section id="view-chores" hidden>
      <div class="seg" id="choreSeg"></div>
      <div class="seg" id="choreFilter" style="margin-bottom:8px"></div>
      <div class="small muted" id="choreStats" style="margin:0 2px 10px" hidden></div>
      <form class="row" id="choreForm" style="margin-bottom:12px">
        <input id="choreIn" placeholder="Nueva tarea…" autocomplete="off" maxlength="200">
        <button type="submit">Añadir</button>
        <button type="button" class="soft" id="choreMore" aria-label="Más opciones">Más</button>
      </form>
      <div class="card" id="choreList"></div>
      <button class="danger" id="clearChores" style="width:100%">Borrar las hechas</button>
    </section>

    <section id="view-menu" hidden>
      <div id="menuBox"></div>
    </section>
  </main>
  <nav id="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendario</button>
    <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Chat</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Compra</button>
    <button data-tab="chores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Coses</button>
    <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg>Menú</button>
  </nav>
</div>

<div id="modal" class="sheet-bg" hidden><div class="sheet" id="sheet"></div></div>
